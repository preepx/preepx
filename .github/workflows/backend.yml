name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Replace 'preepx/backend' with the actual path to your backend folder on the EC2 server
          cd ~/preepx/backend
          
          # Pull the latest code from the main branch
          git pull origin main
          
          # Install dependencies
          npm install
          
          # Restart the PM2 process (assuming your PM2 process is named 'backend' or 'server')
          # Update 'server' below with your actual PM2 process name
          pm2 restart server || pm2 start server.js --name "server"
