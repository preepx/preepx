name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build project
      working-directory: ./frontend
      run: npm run build
      env:
        VITE_API_URL: https://api.preepx.in/api
        VITE_QAPI_URL: https://api.preepx.in/api
        VITE_RECAPTCHA_SITE_KEY: 6Le942wtAAAAAN6FuMHTa_XTaqGfu0Fl2bgOZDm7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to S3 bucket
      working-directory: ./frontend
      run: aws s3 sync dist/ s3://frontendpreepx --delete

    - name: Invalidate CloudFront Cache
      run: aws cloudfront create-invalidation --distribution-id E3KHF3XV02R6KW --paths "/*"
