services:
  - type: web
    name: qbank-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: MOCK_INTERVIEW_URL
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
